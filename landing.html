<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Editor</title>
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/landing.css" />
</head>
<body>
  <div class="landing-container">
    <header class="landing-header">
      <h1>Markdown Editor</h1>
      <div class="landing-header-actions">
        <div id="sync-status" class="sync-status sync-idle" title="同期状態"></div>
        <button id="btn-sync" title="今すぐ同期">
          <svg xmlns="http://www.w3.org/2000/svg" height="16" viewBox="0 -960 960 960" width="16" fill="currentColor" aria-hidden="true"><path d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 118-120 191t-190 73Z"/></svg>
          同期
        </button>
        <a href="settings.html" class="btn-settings" id="btn-settings" title="設定">
          <svg xmlns="http://www.w3.org/2000/svg" height="16" viewBox="0 -960 960 960" width="16" fill="currentColor" aria-hidden="true"><path d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-1 13.5l103 78-110 190-119-50q-11 8-23 15t-24 12L590-80H370Zm70-80h79l14-106q31-8 57.5-23.5T639-327l99 41 39-68-86-65q5-14 7-29.5t2-31.5q0-16-2-31.5t-7-29.5l86-65-39-68-99 42q-22-23-48.5-38.5T533-694l-13-106h-79l-14 106q-31 8-57.5 23.5T321-633l-99-41-39 68 86 65q-5 14-7 29.5t-2 31.5q0 16 2 31.5t7 29.5l-86 65 39 68 99-42q22 23 48.5 38.5T427-266l13 106Zm42-180q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Zm-2-140Z"/></svg>
          <span class="settings-badge hidden" id="settings-badge" aria-label="設定に不備があります"></span>
        </a>
        <button class="primary" id="btn-new">
          <span>+</span>
          <span>新規</span>
        </button>
      </div>
    </header>

    <main>
      <div id="doc-list" class="doc-list">
        <div class="loading">読み込み中...</div>
      </div>
    </main>
  </div>

  <!-- コンフリクト解決モーダル -->
  <div class="modal-overlay hidden" id="conflict-modal">
    <div class="modal conflict-modal">
      <div class="modal-header">
        <h2>⚠ 編集が競合しています</h2>
      </div>
      <p class="conflict-desc">同じドキュメントが複数のデバイスで編集されています。どちらを残しますか？</p>
      <div class="conflict-versions">
        <div class="conflict-version" id="conflict-local">
          <div class="conflict-version-header">
            <strong>このデバイス（ローカル）</strong>
            <span class="conflict-meta" id="conflict-local-meta"></span>
          </div>
          <pre class="conflict-preview" id="conflict-local-preview"></pre>
          <button class="primary" data-choice="local">ローカルを使う</button>
        </div>
        <div class="conflict-version" id="conflict-remote">
          <div class="conflict-version-header">
            <strong>Google Drive</strong>
            <span class="conflict-meta" id="conflict-remote-meta"></span>
          </div>
          <pre class="conflict-preview" id="conflict-remote-preview"></pre>
          <button data-choice="remote">Drive を使う</button>
        </div>
      </div>
      <p class="conflict-note">※ 選ばれなかった方は失われます</p>
    </div>
  </div>

  <script type="module" src="/src/pages/landing.ts"></script>
</body>
</html>
