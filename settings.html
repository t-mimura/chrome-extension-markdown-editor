<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>設定 — Markdown Editor</title>
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/settings.css" />
</head>
<body>
  <div class="settings-container">
    <header class="settings-header">
      <a href="landing.html" class="btn-back" title="戻る">←</a>
      <h1>設定</h1>
    </header>

    <section class="settings-section">
      <h2>Google Drive 同期</h2>
      <p class="settings-desc">
        ドキュメントと画像を Google Drive にバックアップし、複数デバイス間で同期します。
      </p>

      <div id="device-name-warning" class="settings-warning hidden">
        ⚠ Google Drive に接続済みですが、デバイス名が未設定です。<br>
        コンフリクト発生時にどのデバイスで編集したか判別できなくなります。
      </div>

      <div class="settings-field">
        <label for="device-name">このデバイスの名前</label>
        <input type="text" id="device-name" placeholder="例: MacBook Air" />
        <span class="settings-hint" id="device-name-hint">コンフリクト発生時に「どのデバイスで編集したか」として表示されます</span>
      </div>

      <div class="settings-auth">
        <div id="auth-status" class="auth-status auth-disconnected">
          <span id="auth-status-text">未接続</span>
        </div>
        <div class="auth-buttons">
          <button id="btn-connect" class="primary">Google アカウントに接続</button>
          <button id="btn-disconnect" class="hidden">接続を解除</button>
        </div>
      </div>
    </section>

  </div>

  <script type="module" src="/src/pages/settings.ts"></script>
</body>
</html>
