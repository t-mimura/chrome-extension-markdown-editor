<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Editor</title>
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/editor.css" />
</head>
<body>
  <div class="editor-layout">
    <header class="toolbar">
      <div class="toolbar-left">
        <a href="landing.html" class="btn-back" title="一覧に戻る">←</a>
        <span class="doc-title" id="doc-title">無題</span>
      </div>
      <div class="toolbar-right">
        <div id="sync-status" class="sync-status sync-idle" title="同期状態"></div>
        <button id="btn-toggle-preview" title="プレビューを非表示" aria-label="プレビューを非表示"></button>
        <button id="btn-insert-image" title="画像を挿入" aria-label="画像を挿入">
          <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 -960 960 960" width="18" fill="currentColor" aria-hidden="true"><path d="M480-480ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h320v80H200v560h560v-320h80v320q0 33-23.5 56.5T760-120H200Zm40-160h480L570-480 450-320l-90-120-120 160Zm440-320v-80h-80v-80h80v-80h80v80h80v80h-80v80h-80Z"/></svg>
        </button>
        <select id="font-size-select" title="フォントサイズ" aria-label="フォントサイズ">
          <option value="12">12px</option>
          <option value="14">14px</option>
          <option value="16" selected>16px</option>
          <option value="18">18px</option>
          <option value="20">20px</option>
        </select>
        <select id="theme-select" title="テーマ" aria-label="テーマ">
          <option value="system">システム</option>
          <option value="light">ライト</option>
          <option value="dark">ダーク</option>
        </select>
        <button id="btn-help" title="キーバインドヘルプ">?</button>
      </div>
    </header>

    <div class="editor-body" id="editor-body">
      <div class="editor-pane" id="editor-pane">
        <div id="codemirror-container"></div>
      </div>
      <div class="splitter" id="splitter"></div>
      <div class="preview-pane" id="preview-pane">
        <div class="preview-content" id="preview-content"></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="help-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>キーボードショートカット</h2>
        <button class="modal-close" id="btn-help-close">✕</button>
      </div>
      <table class="help-table">
        <tbody>
          <tr><td><kbd>Ctrl/Cmd + B</kbd></td><td><strong>太字</strong></td></tr>
          <tr><td><kbd>Ctrl/Cmd + I</kbd></td><td><em>イタリック</em></td></tr>
          <tr><td><kbd>Ctrl/Cmd + K</kbd></td><td>リンク挿入</td></tr>
          <tr><td><kbd>Ctrl/Cmd + Shift + H</kbd></td><td>見出し (H1)</td></tr>
          <tr><td><kbd>Ctrl/Cmd + Shift + C</kbd></td><td>コードブロック</td></tr>
          <tr><td><kbd>Ctrl/Cmd + Shift + L</kbd></td><td>リスト</td></tr>
          <tr><td><kbd>Tab</kbd></td><td>リストを一段下げる</td></tr>
          <tr><td><kbd>Shift + Tab</kbd></td><td>リストを一段戻す</td></tr>
          <tr><td><kbd>Ctrl/Cmd + Z</kbd></td><td>もとに戻す</td></tr>
          <tr><td><kbd>Ctrl/Cmd + Shift + Z</kbd></td><td>やり直し</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module" src="/src/pages/editor.ts"></script>
</body>
</html>
